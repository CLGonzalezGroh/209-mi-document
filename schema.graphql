"Input para crear un documento"
input CreateDocumentInput {
  "Código único del documento"
  code: String!
  "Título del documento"
  title: String!
  "Descripción del documento"
  description: String
  "Módulo al que pertenece"
  module: ModuleTypeInput!
  "Proyecto al que pertenece. Obligatorio cuando el módulo es PROJECTS, prohibido en el resto"
  projectId: Int
  "ID del tipo de documento"
  documentTypeId: Int!
  "ID de la clase de documento"
  documentClassId: Int
  """
  Armador del primer circuito. Si se omite lo aporta el proyecto, de modo que en
  la práctica el campo llega lleno. Sin ninguno de los dos, el alta se rechaza.
  """
  assignedOrganizerId: Int
  """
  Esquema con que se propone el código de la primera revisión. NO se persiste:
  gobierna la propuesta y nada más. Si se omite, rige el del proyecto y, en su
  defecto, el del despliegue.
  """
  revisionScheme: RevisionSchemeInput
  """
  Código de la primera revisión. Bajo ALPHA y NUMERIC el sistema lo calcula y
  rechaza uno distinto; bajo FREE_TEXT es obligatorio.
  """
  initialRevisionCode: String
  """
  Archivo inicial, OPCIONAL. El documento nace sin archivo porque el paso de
  elaboración existe para producirlo. Sigue siendo admisible para el proyecto
  que parte de un documento preexistente.
  """
  initialVersion: InitialVersionInput
}

"Archivo con que se da de alta un documento o una revisión preexistente"
input InitialVersionInput {
  "Key del archivo en DO Spaces"
  fileKey: String!
  "Nombre original del archivo"
  fileName: String!
  "Tamaño del archivo en bytes"
