# CONTEXTO DE PROYECTO
# ═══════════════════════════════════════════════════════

"Rol documental que el proyecto declara. Determina el orden entre el circuito de revisión y el transmittal"
enum DocumentRole {
  "Emisor: el sistema es de la ingeniería; el circuito precede a la emisión"
  ISSUER
  "Receptor: el sistema es de la planta; la emisión precede a la calificación"
  RECEIVER
  "Interno: no hay contraparte; el ciclo termina en la aprobación"
  INTERNAL
}

"Rol documental del proyecto, para inputs"
enum DocumentRoleInput {
  "Emisor: el sistema es de la ingeniería; el circuito precede a la emisión"
  ISSUER
  "Receptor: el sistema es de la planta; la emisión precede a la calificación"
  RECEIVER
  "Interno: no hay contraparte; el ciclo termina en la aprobación"
  INTERNAL
}

"Lado del proyecto al que pertenece un miembro"
enum DocProjectSide {
  "Organización que hospeda el sistema. Único lado posible en proyectos internos"
  HOST
  "Cliente en modo Emisor, contratista en modo Receptor"
  COUNTERPARTY
}

"Lado del proyecto, para inputs"
enum DocProjectSideInput {
  "Organización que hospeda el sistema. Único lado posible en proyectos internos"
  HOST
  "Cliente en modo Emisor, contratista en modo Receptor"
  COUNTERPARTY
}

"""
Configuración documental de un proyecto. Un registro por proyecto.
Declara el rol documental y, cuando corresponde, la contraparte.
"""
type DocProjectSettings {
  "¿El proyecto usa el atributo de ubicación física?"
  locationEnabled: Boolean!
  "¿Lo exige al dar de alta un documento? Solo tiene efecto si está habilitado"
  locationRequired: Boolean!
  """
  Etiqueta con que el proyecto la nombra: "área", "unidad", "sector".

  Configurable, a diferencia del esquema de revisión: cada organización usa un
  nombre distinto, mientras que "revisión" es terminología establecida.
  """
  locationLabel: String
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Fecha de última modificación"
  updatedAt: DateTime
  "Proyecto al que corresponde"
  projectId: Int!
  "Rol documental declarado"
  documentRole: DocumentRole!
  "Nombre de la contraparte. Nulo en proyectos internos, que no la tienen"
  counterpartyName: String
  """
  Esquema con que el proyecto propone el código de la PRIMERA revisión de sus
  documentos. Nulo = rige el valor por defecto del despliegue.
  """
  revisionScheme: RevisionScheme
  "Armador por defecto, con el que el alta llega con el campo lleno"
  defaultOrganizer: UserName
}

"Declaración de la configuración documental de un proyecto"
input DeclareDocProjectSettingsInput {
  "¿El proyecto usa el atributo de ubicación física? Por defecto sí"
  locationEnabled: Boolean
  "¿Lo exige al dar de alta un documento? Por defecto no"
  locationRequired: Boolean
  "Etiqueta con que el proyecto la nombra"
  locationLabel: String
  "Proyecto al que corresponde"
  projectId: Int!
  "Rol documental a declarar"
  documentRole: DocumentRoleInput!
  "Nombre de la contraparte. Obligatorio en Emisor y Receptor, prohibido en Interno"
  counterpartyName: String
  "Esquema de revisión del proyecto. Nulo = rige el del despliegue"
  revisionScheme: RevisionSchemeInput
  "Armador por defecto de los documentos del proyecto"
  defaultOrganizerId: Int
}

"""
Configuración documental del despliegue. Registro único.

Es el último escalón de la precedencia documento ▸ proyecto ▸ despliegue:
permite fijar la convención del cliente sin desplegar y sin configurar proyecto
por proyecto.
"""
type DocSettings {
  "Identificador único. Siempre 1"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Fecha de última modificación"
  updatedAt: DateTime
  "Usuario que la declaró"
  updatedBy: UserName!
  "Esquema con que se propone el código de una primera revisión"
  revisionScheme: RevisionScheme!
}

"""
Calificación con que la contraparte responde una emisión.

Reemplaza a la enumeración fija `ClientStatus`: cada cliente tiene su propio
juego de calificaciones, con sus códigos y su cantidad, y el rótulo que el
usuario ve es el del cliente. El código y el rótulo son lo que el usuario ve; el
efecto es lo único que el sistema interpreta.
"""
type DocQualification {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Usuario que la creó"
  createdBy: UserName!
  "Fecha de última modificación"
  updatedAt: DateTime
  "Usuario que la modificó"
  updatedBy: UserName!
  "Fecha de baja lógica. Nula si está vigente"
  terminatedAt: DateTime
  "Provista por el sistema"
  isSys: Boolean!
  """
  Alcance. Nulo = catálogo del despliegue.

  El proyecto que declara una calificación propia usa las suyas y solo las
  suyas: la lista de calificaciones es la del contrato, y una lista mezclada no
  es la de nadie.
  """
  projectId: Int
  "Código de la contraparte, tal como ella lo usa"
  code: String!
  "Rótulo que el usuario ve"
  label: String!
  "Lo único que el sistema interpreta"
  effect: QualificationEffect!
  "Orden de la lista del cliente, no el alfabético"
  sortOrder: Int!
  "¿Habilita usar el documento? Derivado del efecto"
  enablesUse: Boolean!
  "¿Obliga a emitir una revisión nueva? Derivado del efecto"
  requiresNewRevision: Boolean!
}

"""
Cómo un proyecto resuelve un catálogo documental.

Una fila por proyecto y catálogo, y no columnas de la configuración del
proyecto: el mecanismo es uno para los tres catálogos. Las demás configuraciones
por proyecto son valores donde lo específico reemplaza a lo general; un catálogo
es un conjunto, y lo que se declara es si se hereda.

La ausencia de fila es INHERIT: no hace falta declarar nada para operar.
"""
type DocCatalogScope {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Usuario que la declaró"
  createdBy: UserName!
  "Fecha de última modificación"
  updatedAt: DateTime
  "Usuario que la modificó"
  updatedBy: UserName!
  "Proyecto que declara"
  projectId: Int!
  "Catálogo alcanzado"
  catalog: DocCatalogKind!
  "Modo declarado"
  mode: DocScopeMode!
}

"""
Proyecto del que este usuario puede copiar el catálogo de ubicación.

Los que alcanza por membresía vigente y que tienen catálogo propio: la
nomenclatura de un cliente es información de ese cliente. El árbol del despliegue
es siempre una fuente posible y no figura acá, porque no es un proyecto.

El nombre del proyecto lo resuelve quien consulta: vive en mi-project y este
módulo no lo duplica.
"""
type DocSeedSource {
  "Proyecto fuente"
  projectId: Int!
  "Cuántos nodos aportaría"
  nodeCount: Int!
}

"""
Resultado de sembrar un catálogo por copia.

Los tres números dicen cosas distintas: lo que se agregó, lo que el destino ya
veía —y por lo tanto no se duplicó— y lo que no viajó por estar dado de baja,
ello o algún ascendiente.
"""
type DocSeedResult {
  "Nodos creados en el destino"
  added: Int!
  "Nodos de la fuente que el destino ya veía, por su ruta"
  alreadyPresent: Int!
  "Nodos no copiados por estar dados de baja, ellos o algún ascendiente"
  skippedTerminated: Int!
}

"Input para declarar cómo un proyecto resuelve un catálogo"
input DeclareCatalogScopeInput {
  "Proyecto que declara"
  projectId: Int!
  "Catálogo alcanzado"
  catalog: DocCatalogKindInput!
  "Modo a declarar"
  mode: DocScopeModeInput!
}

"""
Nodo del catálogo de ubicación física: sitio, planta, área o unidad de proceso.

Jerárquico y auto-referencial, con profundidad libre: se carga como lista plana
de un nivel o como árbol de varios, según cómo cada organización describa su
instalación. El sitio no es una entidad aparte, es el nivel superior del mismo
árbol.

Es un catálogo de **clasificación** y no un registro de activos: afirma cómo
nombra el cliente sus sectores, no que un equipo exista y sea propio.
"""
type DocLocation {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Usuario que lo creó"
  createdBy: UserName!
  "Fecha de última modificación"
  updatedAt: DateTime
  "Usuario que lo modificó"
  updatedBy: UserName!
  "Fecha de baja lógica. Nula si está vigente"
  terminatedAt: DateTime
  "Provisto por el sistema"
  isSys: Boolean!
  """
  Alcance. Nulo = árbol del despliegue, del que los proyectos heredan.

  Con valor, el nodo lo agregó ese proyecto. Un nodo de proyecto puede colgar de
  uno del despliegue —eso es ampliar—, nunca al revés.
  """
  projectId: Int
  "Nodo padre. Nulo si es raíz"
  parent: DocLocation
  "Descendencia directa, ordenada por su orden de presentación"
  children: [DocLocation!]!
  "¿Es hoja? El nodo sin descendencia, que es el que habitualmente se elige"
  isLeaf: Boolean!
  "Código, único dentro de su nivel"
  code: String!
  "Nombre del nodo"
  name: String!
  """
  Ruta completa: los nombres de los ascendientes y el propio, separados por " / ".

  Es denormalización de conveniencia y no evidencia: la ubicación se edita
  siempre y no integra el payload de la firma, de modo que renombrar o mover un
  nodo recalcula las rutas de su descendencia de forma automática.
  """
  path: String!
  "Orden de presentación entre hermanos"
  sortOrder: Int!
  "Origen del objeto que este nodo describe. Nulo si no describe ninguno"
  externalOrigin: DocLocationOrigin
  "Identificador del objeto en el sistema de origen. Viaja con el origen"
  externalRef: String
}

"""
Plantilla del circuito. PROPONE el circuito; el armado lo define.

Se resuelve contra la tupla del propio documento y gana la MÁS ESPECÍFICA
—tipo, después clase, después proyecto—. La plantilla del proyecto con clase y
tipo nulos ES su default, sin necesidad de una marca aparte.
"""
type DocWorkflowTemplate {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Usuario que la creó"
  createdBy: UserName!
  "Fecha de última modificación"
  updatedAt: DateTime
  "Usuario que la modificó"
  updatedBy: UserName!
  "Fecha de baja. Una plantilla dada de baja deja de proponerse"
  terminatedAt: DateTime
  "Indica si es un registro del sistema"
  isSys: Boolean!
  "Nombre de la plantilla"
  name: String!
  "Descripción"
  description: String
  "Proyecto del alcance. Nulo alcanza a los documentos sin proyecto"
  projectId: Int
  "Clase del alcance. Nula = todas las clases"
  documentClass: DocumentClass
  "Tipo del alcance. Nulo = todos los tipos"
  documentType: DocumentType
  "Pasos que propone, en orden"
  steps: [DocWorkflowTemplateStep!]!
}

"""
Paso de una plantilla de circuito.

No incluye el armado ni la elaboración: esos los pone el sistema según el rol
documental del proyecto. El elaborador nunca se preasigna.
"""
type DocWorkflowTemplateStep {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Orden de ejecución"
  stepOrder: Int!
  "Tipo de paso"
  stepType: StepType!
  "Actor preasignado. Nulo = lo designa el armado"
  assignedTo: UserName
}

"""
Membresía documental de un proyecto. Habilita el acceso de un usuario al
proyecto y declara de qué lado está. No define rol ni permisos: provienen del
servicio de administración global.
"""
type DocProjectMember {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Proyecto al que da acceso"
  projectId: Int!
  "Usuario habilitado"
  user: UserName
  "Lado del proyecto al que pertenece"
  side: DocProjectSide!
  "Fecha de alta"
  assignedAt: DateTime!
  "Usuario que dio el alta"
  assignedBy: UserName
  "Si la membresía está vigente"
  isActive: Boolean!
  "Fecha de baja. Nula mientras la membresía esté vigente"
  revokedAt: DateTime
  "Usuario que dio la baja"
  revokedBy: UserName
}

"Alta de un miembro en un proyecto documental"
input AssignDocProjectMemberInput {
  "Proyecto al que se incorpora"
  projectId: Int!
  "Usuario a incorporar"
  userId: Int!
  "Lado del proyecto al que pertenece"
  side: DocProjectSideInput!
}

