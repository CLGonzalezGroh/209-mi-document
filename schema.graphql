  "Módulo al que pertenece"
  module: ModuleTypeInput
  """
  Alcance de la entrada. Omitido = catálogo del despliegue.

  Declararlo exige que el módulo sea PROJECTS, y crear en el alcance de un
  proyecto exige membresía vigente además del permiso.
