# TRANSMITTALS (INGENIERÍA)
# ═══════════════════════════════════════════════════════

"Transmittal de ingeniería"
type Transmittal @key(fields: "id") {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Fecha de última actualización"
  updatedAt: DateTime
  "Usuario que realizó la última actualización"
  updatedBy: UserName!
  "Código del transmittal (ej: TR-001)"
  code: String!
  "ID del proyecto asociado"
  projectId: Int!
  "Estado actual del transmittal"
  status: TransmittalStatus!
  "Naturaleza: entrega de documentación o calificación de una emisión"
  nature: TransmittalNature!
  """
  Sentido de la circulación. Se DERIVA del rol del proyecto y de la naturaleza,
  y no se almacena. Nulo si el proyecto todavía no declaró su rol.
  """
  direction: TransmittalDirection
  "Items incluidos en el transmittal"
  items: [TransmittalItem!]!
  """
  Cómo la contraparte nombra este transmittal en su sistema.

  Un dato del remito ajeno, no un remito propio. Aplica a los dos casos
  entrantes: la emisión del contratista en modo Receptor y la respuesta del
  cliente en modo Emisor.
  """
  counterpartyReference: String
  "La emisión que esta respuesta contesta. Nula en las emisiones"
  respondsTo: Transmittal
  "Las respuestas que contestan a esta emisión"
  responses: [Transmittal!]!
  "Fecha de emisión"
  issuedAt: DateTime
  "Usuario que emitió el transmittal"
  issuedBy: UserName!
  """
  Quién acusó recibo, como texto. El cliente no es usuario del sistema.

  El acuse es del ENVÍO y no del documento: dice que llegó, no qué opina la
  contraparte. Por eso vive acá y no en el ítem, y no es una calificación.
  """
  acknowledgedBy: String
  "Fecha REAL del acuse"
  acknowledgedAt: DateTime
  "Quién registró el acuse"
  acknowledgeRegisteredBy: UserName
  "Fecha de registro del acuse"
  acknowledgeRegisteredAt: DateTime
  "Fecha de cierre"
  closedAt: DateTime
  "Quién lo cerró"
  closedBy: UserName
  "Motivo del cierre, si se declaró"
  closeReason: String
  """
  Avance de las respuestas, DERIVADO.

  Cuenta solo los ítems cuyo propósito espera calificación: *faltan 3 de las 5
  que esperaban respuesta* en lugar de *faltan 3 de 8*. Es lo que el cierre
  muestra, no lo que lo condiciona.
  """
  responseProgress: TransmittalResponseProgress!
}

"""
Avance de las respuestas de un transmittal.

Se deriva de los ítems y de su propósito; no se almacena.
"""
type TransmittalResponseProgress {
  "Ítems cuyo propósito espera calificación"
  expected: Int!
  "De esos, los que ya tienen respuesta"
  answered: Int!
  "Los que faltan contestar"
  pending: Int!
}

"Item de un transmittal"
type TransmittalItem {
  "Identificador único"
  id: Int!
  "Transmittal al que pertenece"
  transmittal: Transmittal!
  "Revisión del documento incluida"
  documentRevision: DocumentRevision!
  "Propósito del envío del documento"
  purposeCode: PurposeCode!
  """
  ¿Se espera calificación de la contraparte? Derivado del propósito.

  Es expectativa y no permiso: una respuesta sobre una emisión informativa se
  registra igual. Lo que gobierna es qué figura como pendiente.
  """
  expectsQualification: Boolean!
  """
  Roles de archivo que el propósito espera y la versión emitida no trae.

  Es **advertencia y no puerta**: al emitir, la revisión ya está aprobada y su
  versión es inmutable, de modo que no habría forma legal de agregar lo que
  falta. El caso legítimo existe — el editable que por tamaño o formato viaja
  por otro medio.
  """
  missingFileRoles: [DocFileRole!]!
  """
  La respuesta de la contraparte sobre este documento. Nula mientras no llegó.

  Es un objeto propio y no una versión: el archivo que devuelve la contraparte
  llega de afuera del circuito, sin paso vigente que lo produzca ni firma que lo
  acredite.
  """
  response: DocTransmittalResponse
}

"""
Respuesta de la contraparte sobre un documento emitido.

Cuelga del ítem por el que ese documento salió. Una por ítem: la contraparte
califica una emisión una sola vez, y corregirla es editar esta.
"""
type DocTransmittalResponse {
  "Identificador único"
  id: Int!
  "Fecha de REGISTRO de la respuesta"
  createdAt: DateTime!
  "Fecha de la última corrección"
  updatedAt: DateTime
  "El ítem por el que ese documento salió"
  transmittalItem: TransmittalItem!
  "Calificación con que la contraparte respondió. Único dato obligatorio"
  qualification: DocQualification!
  "Comentarios de la contraparte"
  comments: String
  """
  Quién respondió, como texto.

  El cliente que responde por correo o por un repositorio compartido no es
  usuario del sistema y no tiene `User` que lo represente. Nulo cuando la
  respuesta la ingresó directamente quien la registra.
  """
  respondedBy: String
  "Fecha REAL de la respuesta, frente a createdAt que es la de registro"
  respondedAt: DateTime
  "Quién la registró. En el caso habitual, el control documental"
  registeredBy: UserName!
  """
  ¿La transcribió alguien distinto de quien respondió?

  Se DERIVA de que ambos datos existan, en lugar de almacenarse como indicador.
  """
  transcribed: Boolean!
  "El sobre en que viajó, si vino consolidada. Nulo documento a documento"
  responseTransmittal: Transmittal
  "Los archivos marcados que devolvió la contraparte. Pueden no existir"
  files: [DocResponseFile!]!
}

"Archivo devuelto por la contraparte junto con su calificación"
type DocResponseFile {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Key en el repositorio"
  fileKey: String!
  "Nombre original del archivo"
  fileName: String!
  "Tamaño en bytes"
  fileSize: Int!
  "Tipo MIME"
  mimeType: String!
  """
  Integridad del archivo. Opcional, a diferencia del archivo de una versión:
  nadie firma la respuesta, de modo que no hay firma que dependa de él.
  """
  checksum: String
}

