y la elaboración los pone el sistema: no se declaran acá.
"""
input DefineWorkflowInput {
  """
  Elaborador. Obligatorio salvo en el rol Receptor, donde el documento llega ya
  elaborado desde afuera y el circuito no tiene paso de elaboración.
