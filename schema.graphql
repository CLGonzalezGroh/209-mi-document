"Esquema de revisión del documento"
enum RevisionScheme {
  "Alfabético: A, B, C, ..., Z, AA, AB, ... El sistema calcula el código."
  ALPHA
  "Numérico: 0, 1, 2, 3, ... El sistema calcula el código."
  NUMERIC
  "Texto libre: lo ingresa el usuario y solo se valida que no se repita."
  FREE_TEXT
}

"Estado de las revisiones de un documento"
enum RevisionStatus {
  "En elaboración: el circuito está en armado o en elaboración"
  DRAFT
  "Sometida: el circuito avanza por revisión y aprobación"
  IN_REVIEW
  "Aprobada: metadata congelada, no admite versiones nuevas"
  APPROVED
  "Reemplazada por una revisión posterior aprobada"
  SUPERSEDED
  "Se desistió de ella antes de aprobarla. No consume código de revisión"
  ABANDONED
}

"Estado del workflow de revisión"
enum WorkflowStatus {
  "Circuito abierto. El circuito nace iniciado"
  IN_PROGRESS
  "Los pasos que deciden se resolvieron favorablemente"
  COMPLETED
  "Un paso que decide rechazó"
  REJECTED
  "Retirado sin juicio, con su motivo"
  CANCELLED
}

"Tipo de paso en el workflow de revisión"
enum StepType {
  "Armado: designa elaborador y revisores, y materializa los pasos siguientes"
  ASSIGN
  "Elaboración: el documento está hecho y se somete a revisión"
  PREPARE
  "Revisión técnica"
  REVIEW
  "Aprobación formal"
  APPROVE
  "Toma de conocimiento"
  ACKNOWLEDGE
}

"Estado de un paso del workflow"
enum StepStatus {
  "No resuelto aún"
  PENDING
  "Cumplido, sin emitir juicio: armado, elaboración y toma de conocimiento"
  COMPLETED
  "Aprobado por quien resolvió: solo revisión y aprobación"
  APPROVED
  "Rechazado por quien resolvió: solo revisión y aprobación"
  REJECTED
  "Saltado por rechazo o por cancelación del circuito"
  SKIPPED
}

"""
Naturaleza del transmittal.

La clasificación relevante no es la dirección sino el propósito, que determina
qué reglas lo gobiernan. El sentido se deriva del rol del proyecto y de la
naturaleza, y no se declara.
"""
enum TransmittalNature {
  "Entrega de documentación producida"
  EMISSION
  "Calificación consolidada de una emisión. Solo en modo Emisor"
  RESPONSE
}

"""
Sentido de la circulación. DERIVADO del rol del proyecto y de la naturaleza.

Nulo solo en las combinaciones que ningún transmittal puede tener, que el
sistema impide crear.
"""
enum TransmittalDirection {
  "Sale del sistema hacia la contraparte"
  OUTGOING
  "Llega al sistema desde la contraparte"
  INCOMING
}

"Estado del transmittal"
enum TransmittalStatus {
  "En preparación"
  DRAFT
  "Enviado al cliente"
  ISSUED
  "Cliente acusó recibo"
  ACKNOWLEDGED
  "Cliente respondió con comentarios"
  RESPONDED
  "Cerrado"
  CLOSED
}

"Código de propósito del envío"
enum PurposeCode {
  "Para aprobación del cliente"
  FOR_APPROVAL
  "Solo informativo"
  FOR_INFORMATION
  "Aprobado para construcción"
  FOR_CONSTRUCTION
  "Para revisión y comentarios"
  FOR_REVIEW
  "Documentación as-built"
  AS_BUILT
}

"""
Efecto de una calificación de la contraparte.

Lo que cambia el tratamiento aguas abajo son dos preguntas independientes
—¿habilita usar el documento? ¿obliga a emitir una revisión nueva?— y solo tres
de sus cuatro combinaciones existen: si el documento no sirve, hay que volver a
emitirlo. Por eso es una enumeración de tres valores y no dos indicadores.
"""
enum QualificationEffect {
  "Habilita usar el documento. No obliga a emitir revisión nueva"
  ACCEPTED
  "Habilita usar el documento y obliga a emitir revisión nueva"
  ACCEPTED_WITH_COMMENTS
  "No habilita usar el documento y obliga a emitir revisión nueva"
  REJECTED
}

"""
De dónde viene el objeto que un nodo de ubicación describe, cuando describe uno.

Es el puente con el registro de activos —dueño del árbol cuando ese módulo
exista— y con un sistema documental externo. Externo es respecto de este módulo,
que es el que resuelve la referencia.
"""
enum DocLocationOrigin {
  "El registro de activos de OperMask"
  ASSETS
  "Un sistema ajeno al ecosistema"
  EXTERNAL
}

"""
Cómo resuelve un proyecto un catálogo documental.

INHERIT es vínculo vivo: las entradas del despliegue aparecen siempre, más las
que el proyecto agregue. OWN es sin vínculo: el proyecto no ve nada del
despliegue. La ausencia de declaración es INHERIT.
"""
enum DocScopeMode {
  "Hereda el catálogo del despliegue y lo amplía"
  INHERIT
  "Catálogo propio, sin ver el del despliegue"
  OWN
}

"Modo de alcance de un catálogo, para inputs"
enum DocScopeModeInput {
  "Hereda el catálogo del despliegue y lo amplía"
  INHERIT
  "Catálogo propio, sin ver el del despliegue"
  OWN
}

"""
Catálogos documentales cuyo alcance el proyecto declara.

El mecanismo es uno para los tres. LOCATION lo estrena BLOQUE 02B; clase y tipo
se incorporan con su propio bloque.
