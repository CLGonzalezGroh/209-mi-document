# ═══════════════════════════════════════════════════════
# CONTEXTO DE PROYECTO
# ═══════════════════════════════════════════════════════

"Rol documental que el proyecto declara. Determina el orden entre el circuito de revisión y el transmittal"
enum DocumentRole {
  "Emisor: el sistema es de la ingeniería; el circuito precede a la emisión"
  ISSUER
  "Receptor: el sistema es de la planta; la emisión precede a la calificación"
  RECEIVER
  "Interno: no hay contraparte; el ciclo termina en la aprobación"
  INTERNAL
}

"Rol documental del proyecto, para inputs"
enum DocumentRoleInput {
  "Emisor: el sistema es de la ingeniería; el circuito precede a la emisión"
  ISSUER
  "Receptor: el sistema es de la planta; la emisión precede a la calificación"
  RECEIVER
  "Interno: no hay contraparte; el ciclo termina en la aprobación"
  INTERNAL
}

"Lado del proyecto al que pertenece un miembro"
enum DocProjectSide {
  "Organización que hospeda el sistema. Único lado posible en proyectos internos"
  HOST
  "Cliente en modo Emisor, contratista en modo Receptor"
  COUNTERPARTY
}

"Lado del proyecto, para inputs"
enum DocProjectSideInput {
  "Organización que hospeda el sistema. Único lado posible en proyectos internos"
  HOST
  "Cliente en modo Emisor, contratista en modo Receptor"
  COUNTERPARTY
}

"""
Configuración documental de un proyecto. Un registro por proyecto.
Declara el rol documental y, cuando corresponde, la contraparte.
"""
type DocProjectSettings {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Fecha de última modificación"
  updatedAt: DateTime
  "Proyecto al que corresponde"
  projectId: Int!
  "Rol documental declarado"
  documentRole: DocumentRole!
  "Nombre de la contraparte. Nulo en proyectos internos, que no la tienen"
  counterpartyName: String
  """
  Esquema con que el proyecto propone el código de la PRIMERA revisión de sus
  documentos. Nulo = rige el valor por defecto del despliegue.
  """
  revisionScheme: RevisionScheme
  "Armador por defecto, con el que el alta llega con el campo lleno"
  defaultOrganizer: UserName
}

"Declaración de la configuración documental de un proyecto"
input DeclareDocProjectSettingsInput {
  "Proyecto al que corresponde"
  projectId: Int!
  "Rol documental a declarar"
  documentRole: DocumentRoleInput!
  "Nombre de la contraparte. Obligatorio en Emisor y Receptor, prohibido en Interno"
  counterpartyName: String
  "Esquema de revisión del proyecto. Nulo = rige el del despliegue"
  revisionScheme: RevisionSchemeInput
  "Armador por defecto de los documentos del proyecto"
  defaultOrganizerId: Int
}

"""
Configuración documental del despliegue. Registro único.

Es el último escalón de la precedencia documento ▸ proyecto ▸ despliegue:
permite fijar la convención del cliente sin desplegar y sin configurar proyecto
por proyecto.
"""
type DocSettings {
  "Identificador único. Siempre 1"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Fecha de última modificación"
  updatedAt: DateTime
  "Usuario que la declaró"
  updatedBy: UserName!
  "Esquema con que se propone el código de una primera revisión"
  revisionScheme: RevisionScheme!
}

"""
Plantilla del circuito. PROPONE el circuito; el armado lo define.

Se resuelve contra la tupla del propio documento y gana la MÁS ESPECÍFICA
—tipo, después clase, después proyecto—. La plantilla del proyecto con clase y
tipo nulos ES su default, sin necesidad de una marca aparte.
"""
type DocWorkflowTemplate {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Usuario que la creó"
  createdBy: UserName!
  "Fecha de última modificación"
  updatedAt: DateTime
  "Usuario que la modificó"
  updatedBy: UserName!
  "Fecha de baja. Una plantilla dada de baja deja de proponerse"
  terminatedAt: DateTime
  "Indica si es un registro del sistema"
  isSys: Boolean!
  "Nombre de la plantilla"
  name: String!
  "Descripción"
  description: String
  "Proyecto del alcance. Nulo alcanza a los documentos sin proyecto"
  projectId: Int
  "Clase del alcance. Nula = todas las clases"
  documentClass: DocumentClass
  "Tipo del alcance. Nulo = todos los tipos"
  documentType: DocumentType
  "Pasos que propone, en orden"
  steps: [DocWorkflowTemplateStep!]!
}

"""
Paso de una plantilla de circuito.

No incluye el armado ni la elaboración: esos los pone el sistema según el rol
documental del proyecto. El elaborador nunca se preasigna.
"""
type DocWorkflowTemplateStep {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Orden de ejecución"
  stepOrder: Int!
  "Tipo de paso"
  stepType: StepType!
  "Actor preasignado. Nulo = lo designa el armado"
  assignedTo: UserName
}

"""
Membresía documental de un proyecto. Habilita el acceso de un usuario al
proyecto y declara de qué lado está. No define rol ni permisos: provienen del
servicio de administración global.
"""
type DocProjectMember {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Proyecto al que da acceso"
  projectId: Int!
  "Usuario habilitado"
  user: UserName
  "Lado del proyecto al que pertenece"
  side: DocProjectSide!
  "Fecha de alta"
  assignedAt: DateTime!
  "Usuario que dio el alta"
  assignedBy: UserName
  "Si la membresía está vigente"
  isActive: Boolean!
  "Fecha de baja. Nula mientras la membresía esté vigente"
  revokedAt: DateTime
  "Usuario que dio la baja"
  revokedBy: UserName
}

"Alta de un miembro en un proyecto documental"
input AssignDocProjectMemberInput {
  "Proyecto al que se incorpora"
  projectId: Int!
  "Usuario a incorporar"
  userId: Int!
  "Lado del proyecto al que pertenece"
  side: DocProjectSideInput!
}

