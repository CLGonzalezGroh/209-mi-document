# ═══════════════════════════════════════════════════════
# QUERIES
# ═══════════════════════════════════════════════════════

type Query {
  # ─── Documentos ───
  "Obtener un documento por ID"
  documentById(id: Int!): Document

  "Listar documentos con filtro, paginación y ordenamiento"
  documents(
    filter: DocumentFilterInput
    pagination: PaginationInput
    orderBy: DocumentOrderByInput
  ): DocumentConnection!

  "Documentos filtrados por referencia de módulo"
  documentsByModule(
    module: ModuleTypeInput!
    pagination: PaginationInput
    orderBy: DocumentOrderByInput
  ): DocumentConnection!

  "Listado de documentos para selectores"
  documentsSelectList(filter: DocumentFilterInput): [SelectList!]!

  # ─── Tipos de documento ───
  "Listar tipos de documento"
  documentTypes(
    "Ámbito a listar. Omitido = catálogo del despliegue"
    projectId: Int
    filter: DocumentTypeFilterInput
    pagination: PaginationInput
    orderBy: DocumentTypeOrderByInput
  ): DocumentTypeConnection!

  "Obtener un tipo de documento por ID"
  documentTypeById(id: Int!): DocumentType

  """
  Tipos de documento vigentes como lista de selección, con el alcance resuelto.

  projectId es opcional porque hay documentos sin proyecto —calidad, comercial,
  activos—, y para ellos rige el catálogo del despliegue. Omitirlo nombra ese
  ámbito y no desactiva el filtro.
  """
  documentTypesSelectList(
    module: ModuleTypeInput
    classId: Int
    projectId: Int
  ): [SelectList!]!

  # ─── Clases de documento ───
  "Listar clases de documento"
  documentClasses(
    "Ámbito a listar. Omitido = catálogo del despliegue"
    projectId: Int
    filter: DocumentClassFilterInput
    pagination: PaginationInput
    orderBy: DocumentClassOrderByInput
  ): DocumentClassConnection!

  "Obtener una clase de documento por ID"
  documentClassById(id: Int!): DocumentClass

  """
  Clases de documento vigentes como lista de selección, con el alcance resuelto.

  projectId es opcional porque hay documentos sin proyecto —calidad, comercial,
  activos—, y para ellos rige el catálogo del despliegue. Omitirlo nombra ese
  ámbito y no desactiva el filtro.
  """
  documentClassesSelectList(
    module: ModuleTypeInput
    projectId: Int
  ): [SelectList!]!

  # ─── Áreas ───
  "Listar áreas"
  areas(
    filter: AreaFilterInput
    pagination: PaginationInput
    orderBy: AreaOrderByInput
  ): AreaConnection!

  "Obtener un área por ID"
  areaById(id: Int!): Area

  "Listado de áreas para selectores"
  areasSelectList(projectId: Int!): [SelectList!]!

  # ─── Revisiones ───
  "Obtener una revisión por ID"
  revisionById(id: Int!): DocumentRevision

  # ─── Transmittals ───
  "Obtener un transmittal por ID"
  transmittalById(id: Int!): Transmittal

  "Listar transmittals con filtro, paginación y ordenamiento"
  transmittals(
    filter: TransmittalFilterInput
    pagination: PaginationInput
    orderBy: TransmittalOrderByInput
  ): TransmittalConnection!

  "Transmittals de un proyecto específico"
  transmittalsByProject(
    projectId: Int!
    pagination: PaginationInput
  ): TransmittalConnection!

  # ─── Workflows ───
  """
  Pasos pendientes del usuario autenticado.

  El argumento es OPCIONAL: omitido devuelve los propios; informado y distinto,
  exige el permiso de administración del circuito. Sigue acotado por membresía:
  ese permiso habilita ver pendientes ajenos, no proyectos ajenos.

  Incluye los acuses de circuitos ya cerrados, que es donde viven.
  """
  pendingReviewSteps(userId: Int): [ReviewStep!]!

  "Circuitos filtrados por estado"
  workflowsByStatus(status: WorkflowStatusInput!): [ReviewWorkflow!]!

  "Plantillas de circuito. Con proyecto, devuelve las suyas y las de alcance general"
  docWorkflowTemplates(projectId: Int): [DocWorkflowTemplate!]!

  """
  Plantilla que regiría para un documento con ese alcance, con la más específica
  ganando. Es la misma resolución que hace el alta, expuesta para poder mostrar
  el circuito propuesto ANTES de crear el documento.
  """
  proposedWorkflowTemplate(
    projectId: Int
    documentClassId: Int
    documentTypeId: Int
  ): DocWorkflowTemplate

  # ─── Adjuntos ───
  "Obtener un adjunto por ID"
  attachmentById(id: Int!): Attachment

  "Listar adjuntos por referencia de módulo"
  attachmentsByModule(
    module: ModuleTypeInput!
    entityType: String!
    entityId: Int!
    pagination: PaginationInput
  ): AttachmentConnection!

  # ─── Logs del Sistema ───
  "Obtiene un log del sistema por su identificador"
  documentSysLogById(id: Int!): DocumentSysLog

  "Obtiene una lista paginada de logs del sistema"
  documentSysLogs(
    filter: DocumentSysLogFilterInput
    pagination: PaginationInput
    orderBy: DocumentSysLogOrderByInput
  ): DocumentSysLogConnection!

  # ─── Logs Archivados del Sistema ───
  "Obtiene un log archivado del sistema por su identificador"
  documentSysLogArchiveById(id: Int!): DocumentSysLogArchive

  "Obtiene una lista paginada de logs archivados del sistema"
  documentSysLogsArchive(
    filter: DocumentSysLogFilterInput
    pagination: PaginationInput
    orderBy: DocumentSysLogOrderByInput
  ): DocumentSysLogArchiveConnection!

  # ─── Archivos Escaneados ───
  "Obtener un archivo escaneado por ID"
  scannedFileById(id: Int!): ScannedFile

  "Listar archivos escaneados con filtro, paginación y ordenamiento"
  scannedFiles(
    filter: ScannedFileFilterInput
    pagination: PaginationInput
    orderBy: ScannedFileOrderByInput
  ): ScannedFileConnection!

  "Obtener estadísticas de archivos escaneados por estado"
  scannedFileStats(filter: ScannedFileFilterInput): ScannedFileStats!

  # ─── Dependencias Cross-Service ───
  "Verifica si una entidad externa tiene dependencias documentales"
  checkDocumentDependencies(
    entityType: DocumentDependencyEntityInput!
    entityId: Int!
  ): DependencyCheck!

  # ─── Trazabilidad Funcional ───
  "Transiciones de estado de un objeto, en orden cronológico"
  docWorkflowEvents(
    objectType: DocObjectTypeInput!
    objectId: Int!
    "Acota la traza a un módulo. El contexto se persiste derivado del objeto"
    module: ModuleTypeInput
    "Acota la traza a un proyecto. El contexto se persiste derivado del objeto"
    projectId: Int
  ): [DocWorkflowEvent!]!

  "Acciones ejecutadas sobre un objeto, en orden cronológico"
  docAuditEvents(
    objectType: DocObjectTypeInput!
    objectId: Int!
    "Acota la traza a un módulo. El contexto se persiste derivado del objeto"
    module: ModuleTypeInput
    "Acota la traza a un proyecto. El contexto se persiste derivado del objeto"
    projectId: Int
  ): [DocAuditEvent!]!

  # ─── Contexto de proyecto ───

  "Configuración documental de un proyecto. Nula si todavía no declaró su rol"
  docProjectSettings(projectId: Int!): DocProjectSettings

  """
  Documentos pendientes de salir en un proyecto.

  No hay documento esperado: hay documento, y pendiente es el que todavía no
  salió. No se declara con un atributo — se DERIVA de la ausencia de ítem de
  transmittal para su revisión en curso.

  Qué significa según el rol del proyecto:

  - **Emisor** — la revisión en curso está aprobada y todavía no se emitió. Es
    también la lista de candidatos a incorporar al próximo transmittal.
  - **Receptor** — el contratista todavía no la entregó en ningún transmittal.
  - **Interno** — devuelve vacío: sin contraparte no hay emisión, de modo que no
    hay nada pendiente de salir.

  Mira la revisión EN CURSO y no cualquiera: después de que la contraparte
  rechaza, el documento debe la siguiente y vuelve a figurar.
  """
  pendingDocuments(projectId: Int!): [Document!]!

  "Configuración documental del despliegue. Registro único"
  docSettings: DocSettings!

  "Catálogo de calificaciones tal como está declarado, sin resolver alcance"
  qualifications(filter: QualificationFilterInput): [DocQualification!]!

  "Una calificación por su identificador"
  qualificationById(id: Int!): DocQualification!

  """
  Calificaciones con que se puede responder en un proyecto.

  Resuelve el alcance —las propias si el proyecto declaró alguna, las del
  despliegue si no— y excluye las dadas de baja.
  """
  projectQualifications(projectId: Int!): [DocQualification!]!

  "Calificaciones vigentes del proyecto, como lista de selección"
  qualificationsSelectList(projectId: Int!): [SelectList!]!

  "Miembros de un proyecto documental"
  docProjectMembers(
    projectId: Int!
    "Incluye las membresías dadas de baja. Por defecto solo las vigentes"
    includeRevoked: Boolean
  ): [DocProjectMember!]!

  """
  Catálogo de ubicación física, como lista plana ordenada por ruta.

  El orden por ruta agrupa cada rama con su descendencia, que es lo que una
  pantalla de árbol necesita para armarse sin recorrer la jerarquía.
  """
  locations(
    "Alcance a listar. Omitido = árbol del despliegue"
    projectId: Int
    filter: DocLocationFilterInput
  ): [DocLocation!]!

  """
  Ubicaciones con que se puede clasificar en un proyecto, con el alcance resuelto.

  Hereda del despliegue y suma las propias, o devuelve solo las propias, según lo
  que el proyecto haya declarado. Excluye las dadas de baja.
  """
  projectLocations(projectId: Int!, filter: DocLocationFilterInput): [DocLocation!]!

  """
  El modo con que un proyecto resuelve este catálogo, resuelto.

  Existe además de catalogScopes porque esa consulta devuelve lo declarado, que
  puede ser nada, y quien arma una pantalla necesita el modo que rige.
  """
  locationScope(projectId: Int!): DocScopeMode!

  """
  De qué proyectos puede este usuario copiar el catálogo hacia el indicado.

  Los que alcanza por membresía vigente y que tienen catálogo propio, sin el
  destino. Evita ofrecer proyectos cuya siembra no agregaría nada.
  """
  locationSeedSources(projectId: Int!): [DocSeedSource!]!

  "Un nodo de ubicación por su identificador"
  locationById(id: Int!): DocLocation!

  """
  Ubicaciones vigentes como lista de selección, con el alcance resuelto.

  El rótulo es la ruta completa y no el nombre: "Unidad 110" no identifica nada
  por sí solo, y el mismo nombre puede repetirse en dos plantas.

  projectId es opcional porque hay documentos sin proyecto —calidad, comercial,
  activos—, y para ellos el catálogo que rige es el del despliegue.
  """
  locationsSelectList(projectId: Int, filter: DocLocationFilterInput): [SelectList!]!

  """
  El alcance de los catálogos que el proyecto declaró, que puede ser ninguno.

  No completa con INHERIT los catálogos sin declarar: la ausencia es el default, y
  fabricar filas inexistentes haría indistinguible lo declarado de lo supuesto.
  """
  catalogScopes(projectId: Int!): [DocCatalogScope!]!
}

# ═══════════════════════════════════════════════════════
# DEPENDENCIAS CROSS-SERVICE
# ═══════════════════════════════════════════════════════

"Entidad externa para verificar dependencias documentales"
enum DocumentDependencyEntityInput {
  "Proyecto (Transmittals, ScannedFiles, Areas, Documents)"
  PROJECT
  "Hallazgo de calidad (Documents)"
  FINDING
  "Acción correctiva (Documents)"
  ACTION
}

"Conteo de dependencias por modelo"
type DependencyCount @shareable {
  "Nombre del modelo dependiente"
  model: String! @shareable
  "Cantidad de registros que dependen de la entidad"
  count: Int! @shareable
  "Etiqueta para mostrar en UI"
  label: String! @shareable
}

"Resultado de verificación de dependencias externas"
type DependencyCheck @shareable {
  "ID de la entidad verificada"
  entityId: Int! @shareable
  "Lista de dependencias encontradas por modelo"
  dependencies: [DependencyCount!]! @shareable
  "True si existe al menos una dependencia"
  hasDependencies: Boolean! @shareable
}

# ═══════════════════════════════════════════════════════
# MUTATIONS
# ═══════════════════════════════════════════════════════

type Mutation {
  # ─── Contexto de proyecto ───
  """
  Declara el rol documental del proyecto y su contraparte.
  Es administrativa: se gobierna solo por el permiso global, porque un proyecto
  sin configuración tampoco tiene miembros a quienes exigir membresía.
  """
  declareDocProjectSettings(
    input: DeclareDocProjectSettingsInput!
  ): DocProjectSettings!

  """
  Incorpora un usuario al proyecto, o lo reincorpora si estaba dado de baja.
  Administrativa por el mismo motivo que la anterior.
  """
  assignDocProjectMember(input: AssignDocProjectMemberInput!): DocProjectMember!

  "Da de baja una membresía. Baja lógica: conserva alta, baja y actor"
  revokeDocProjectMember(id: Int!): DocProjectMember!

  # ─── Documentos ───
  "Crear un nuevo documento con su primera revisión y versión"
  createDocument(input: CreateDocumentInput!): Document!

  "Actualizar metadata de un documento"
  updateDocument(id: Int!, input: UpdateDocumentInput!): Document!

  "Eliminar un documento (soft delete)"
  terminateDocument(id: Int!): Document!

  "Reactivar un documento"
  activateDocument(id: Int!): Document!

  # ─── Revisiones ───
  """
  Crear una revisión. Nace con su circuito en armado y, opcionalmente, con el
  archivo de un documento preexistente.
  """
  createRevision(
    documentId: Int!
    input: CreateRevisionInput!
  ): DocumentRevision!

  """
  Abandonar una revisión en curso, con motivo.

  Distinto de cancelar el circuito: acá la revisión NO sobrevive. Si tiene un
  circuito abierto, se cancela con ella. Solo se abandona una revisión no
  aprobada: aprobada, es el documento vigente y corresponde abrir la siguiente.
  La revisión abandonada no consume código.
  """
  abandonRevision(revisionId: Int!, reason: String!): DocumentRevision!

  """
  Editar la identificación de la revisión: título, clase y tipo.

  Vive acá y no en el documento porque está impresa en el rótulo del archivo, y
  lo impreso pertenece a la emisión que lo produjo. La copia del documento se
  replica en el mismo acto.

  Aprobada la revisión, la edición se rechaza. No es una precondición añadida:
  es que una revisión aprobada no se modifica. Abrir la siguiente vuelve a
  habilitarla, y la nueva nace con la identificación copiada de la anterior.
  """
  updateRevisionMetadata(
    revisionId: Int!
    input: UpdateRevisionMetadataInput!
  ): DocumentRevision!

  # ─── Identidad y fin de vida útil del documento ───

  """
  Corregir el código del documento.

  El código es el IDENTIFICADOR y no cambia: está en los transmittals emitidos,
  en el payload de cada firma, en las referencias cruzadas de otros documentos y
  en el rótulo de cada archivo que salió.

  La única excepción es el error de carga, y su ventana es **mientras el
  documento no tenga ninguna revisión aprobada**: la condición material de que
  nada salió. Después, lo que corresponde es un documento nuevo que lo reemplace.

  Si ya existe una versión cargada con el rótulo impreso, corregir el código
  obliga a volver a cargarla. El sistema no puede verificar el interior del
  archivo.
  """
  correctDocumentCode(id: Int!, code: String!): Document!

  """
  Registrar un acto de reemplazo entre documentos, con motivo.

  Reemplazar es superar: los reemplazados quedan obsoletos en el mismo acto.
  Los documentos del acto comparten ámbito.
  """
  replaceDocuments(input: ReplaceDocumentsInput!): DocReplacement!

  """
  Declarar obsoleto un documento por haber salido del alcance, con motivo.

  Es la segunda causa de obsolescencia, la que nada reemplaza. Para la primera
  no hay operación propia: la produce `replaceDocuments`.
  """
  obsoleteDocument(id: Int!, reason: String!): Document!

  # ─── Versiones ───

  """
  Abrir la copia de trabajo, precargada con los archivos de la versión vigente.

  Precargar es lo que vuelve barata la edición: quien corrige el entregable
  abre, lo reemplaza y confirma, y la fuente y el respaldo viajan solos
  conservando su key y su checksum, sin volver a subirse.

  No descarga ni bloquea. A lo sumo hay una abierta por revisión.
  """
  openWorkingCopy(revisionId: Int!): DocWorkingCopy!

  """
  Incorporar un archivo al conjunto en preparación.

  Sirve tanto para adjuntar —el archivo no estaba— como para reemplazar —estaba
  y llega corregido—: es la misma operación porque es el mismo hecho, que el
  conjunto pase a tener este archivo con este contenido.
  """
  putWorkingCopyFile(
    revisionId: Int!
    input: WorkingCopyFileInput!
  ): DocWorkingCopy!

  "Retirar un archivo del conjunto en preparación"
  removeWorkingCopyFile(revisionId: Int!, fileKey: String!): DocWorkingCopy!

  """
  Confirmar la copia: el conjunto se convierte en la versión siguiente.

  **Acá nace la versión**, completa e inmutable. Exige al menos un cambio: sin
  archivo agregado, reemplazado o quitado no hay nada que confirmar, porque la
  versión solo existe con contenido nuevo. Y exige al menos un entregable.
  """
  confirmWorkingCopy(
    revisionId: Int!
    input: ConfirmWorkingCopyInput
  ): DocumentVersion!

  "Descartar la copia de trabajo sin producir versión, con motivo"
  discardWorkingCopy(revisionId: Int!, reason: String!): DocWorkingCopy!

  # ─── Circuito de revisión ───
  """
  Completar el armado: designa elaborador y elenco, y materializa los pasos.

  Desde que se completa, la estructura del circuito es inmutable: no se agregan,
  quitan ni reordenan pasos. Corregirla exige cancelar el circuito y rearmar.
  """
  defineWorkflow(workflowId: Int!, input: DefineWorkflowInput!): ReviewWorkflow!

  """
  Completar la elaboración y someter la revisión.

  Exige al menos una versión con checksum: es la precondición que reemplaza a la
  del alta, ahora que el documento nace sin archivo.
  """
  submitRevision(
    revisionId: Int!
    comments: String
    delegationReason: String
  ): ReviewStep!

  """
  Aprobar un paso que decide —revisión o aprobación—, con firma.

  Los pasos que se cumplen tienen operación propia: aprobar un armado no es lo
  que ocurre.
  """
  approveStep(
    stepId: Int!
    comments: String
    "Obligatorio cuando quien resuelve no es el asignado. Exige el permiso de administración"
    delegationReason: String
    """
    Calificación con que la planta responde, en modo Receptor.

    Exigida cuando esta aprobación CONCLUYE el circuito, porque ahí la
    conclusión es la respuesta, y prohibida en los otros roles. Su efecto debe
    habilitar el documento: el desenlace del paso se deriva del efecto.
    """
    qualificationId: Int
  ): ReviewStep!

  """
  Rechazar un paso, con firma, y reinstanciar el circuito desde la elaboración
  con el mismo elenco copiado. El documento rechazado no queda sin salida ni
  consume una revisión nueva.

  **En modo Receptor el rechazo concluye la revisión** en lugar de devolverla: el
  elaborador está afuera y no hay a quién devolverle el trabajo. No se abre
  circuito nuevo, y la emisión siguiente llega con revisión nueva.
  """
  rejectStep(
    stepId: Int!
    comments: String!
    delegationReason: String
    """
    Calificación con que la planta rechaza, en modo Receptor. Exigida ahí y
    prohibida en los otros roles. Su efecto debe rechazar el documento.
    """
    qualificationId: Int
  ): ReviewStep!

  """
  Cerrar un paso de toma de conocimiento.

  Se resuelve DESPUÉS de que el circuito cerró: el acuse comunica un documento
  ya aprobado, de modo que bloquear la aprobación invertiría su función.
  """
  acknowledgeStep(
    stepId: Int!
    comments: String
    delegationReason: String
  ): ReviewStep!

  """
  Reasignar un paso pendiente, con motivo.

  Cambia el actor y nada más: ni el tipo del paso, ni su orden, ni cuántos son.
  Un paso resuelto no se reasigna, porque su firma acredita quién lo resolvió.
  """
  reassignStep(stepId: Int!, assignedToId: Int!, reason: String!): ReviewStep!

  """
  Cancelar el circuito, con motivo, y rearmarlo desde el armado.

  La revisión SOBREVIVE y vuelve a borrador. Se cancela en cualquier punto, aun
  con pasos ya firmados: nada se elimina, y los pasos resueltos conservan su
  estado y su firma.
  """
  cancelWorkflow(workflowId: Int!, reason: String!): ReviewWorkflow!

  # ─── Plantillas y configuración del despliegue ───
  "Crear una plantilla de circuito"
  createDocWorkflowTemplate(
    input: CreateDocWorkflowTemplateInput!
  ): DocWorkflowTemplate!

  "Actualizar una plantilla. No altera circuitos en curso"
  updateDocWorkflowTemplate(
    id: Int!
    input: UpdateDocWorkflowTemplateInput!
  ): DocWorkflowTemplate!

  "Dar de baja una plantilla. No se elimina: los circuitos conservan su procedencia"
  terminateDocWorkflowTemplate(id: Int!): DocWorkflowTemplate!

  "Declarar la configuración documental del despliegue"
  declareDocSettings(input: DeclareDocSettingsInput!): DocSettings!

  # ─── Calificaciones ───
  "Incorporar una calificación al catálogo del despliegue o de un proyecto"
  createQualification(input: CreateQualificationInput!): DocQualification!

  "Editar una calificación. El alcance no se edita"
  updateQualification(id: Int!, input: UpdateQualificationInput!): DocQualification!

  "Dar de baja lógica una calificación. Lo ya calificado con ella no se revalida"
  terminateQualification(id: Int!): DocQualification!

  "Volver a habilitar una calificación dada de baja"
  activateQualification(id: Int!): DocQualification!

  # ─── Ubicación física ───
  "Incorporar un nodo al catálogo de ubicación física"
  createLocation(input: CreateLocationInput!): DocLocation!

  """
  Renombrar, recodificar, reordenar o declarar la referencia externa de un nodo.

  Cambiar el nombre recalcula la ruta del nodo y de toda su descendencia.
  """
  updateLocation(id: Int!, input: UpdateLocationInput!): DocLocation!

  """
  Mover una rama de lugar. parentId nulo la convierte en raíz.

  Tiene operación propia porque reescribe la ruta de toda su descendencia. Una
  ubicación no puede colgarse de sí misma ni de su propia descendencia.
  """
  moveLocation(id: Int!, parentId: Int): DocLocation!

  """
  Dar de baja lógica un nodo. Lo ya clasificado con él no se revalida.

  La baja no alcanza a la descendencia: un nodo dado de baja con hijos vigentes
  es un estado legítimo.
  """
  terminateLocation(id: Int!): DocLocation!

  "Volver a habilitar un nodo dado de baja"
  activateLocation(id: Int!): DocLocation!

  """
  Eliminar definitivamente un nodo, admitido solo si no tiene descendencia.
  """
  deleteLocation(id: Int!): Boolean!

  """
  Declarar cómo un proyecto resuelve un catálogo documental.

  Upsert por el par proyecto-catálogo: declarar dos veces no acumula filas, y
  volver a INHERIT es declararlo, no borrar la fila.

  Declarar OWN sobre la ubicación se rechaza mientras algún nodo del proyecto
  cuelgue del árbol del despliegue: quedaría colgado de un padre que el proyecto
  ya no ve. El mensaje nombra los nodos que lo impiden.
  """
  declareCatalogScope(input: DeclareCatalogScopeInput!): DocCatalogScope!

  """
  Sembrar el catálogo de ubicación de un proyecto copiando otro.

  La copia es puntual y no deja vínculo: una copia permanente es herencia. La
  fuente es el árbol del despliegue —omitiendo sourceProjectId— o el de otro
  proyecto, cuyo catálogo exige membresía en ese proyecto para leerse.

  Solo agrega: nunca quita ni modifica, se admite más de una vez y sembrar dos
  veces no duplica, porque la identidad de un nodo es su ruta completa. Una
  fuente parcialmente solapada agrega solo las ramas que faltan, colgándolas de
  los nodos que el destino ya tiene.
  """
  seedProjectLocations(
    "Proyecto que recibe la copia"
    projectId: Int!
    "Proyecto del que se copia. Omitido = el árbol del despliegue"
    sourceProjectId: Int
  ): DocSeedResult!

  # ─── Transmittals ───
  "Crear un nuevo transmittal"
  createTransmittal(input: CreateTransmittalInput!): Transmittal!

  """
  Agregar un documento al transmittal, mientras está en borrador.

  Rige la misma puerta que al crear: en una emisión saliente, solo revisiones
  aprobadas. Y la misma unicidad: una revisión se emite una sola vez.
  """
  addTransmittalItem(transmittalId: Int!, input: TransmittalItemInput!): Transmittal!

  """
  Quitar un documento del transmittal, mientras está en borrador.

  Libera la revisión, que vuelve a ser candidata para otra carpeta. Emitido, el
  contenido queda fijo: corregir una emisión ya salida no es editarla sino
  emitir otra.
  """
  removeTransmittalItem(itemId: Int!): Transmittal!

  "Emitir un transmittal (cambiar a ISSUED)"
  issueTransmittal(id: Int!): Transmittal!

  """
  Registrar la respuesta de un documento emitido.

  Es la vía documento a documento, que es la práctica actual. Si la respuesta
  llegó consolidada en un remito, se declara ese sobre y el resultado es el
  mismo objeto.
  """
  registerItemResponse(itemId: Int!, input: RegisterItemResponseInput!): DocTransmittalResponse!

  """
  Corregir una respuesta ya registrada.

  Nadie la firma —el cliente no participa de nuestro circuito— y siendo
  transcripta a mano, el error es esperable. La corrección queda auditada con el
  valor anterior.
  """
  correctItemResponse(responseId: Int!, input: CorrectItemResponseInput!): DocTransmittalResponse!

  """
  Acusar recibo de una emisión.

  Solo en modo Emisor, donde la emisión viaja afuera y no se sabe si llegó. No
  es una calificación y no es precondición de la respuesta.
  """
  acknowledgeTransmittal(id: Int!, input: AcknowledgeTransmittalInput): Transmittal!

  """
  Cerrar un transmittal, como acto documental explícito.

  No exige respuestas completas: las parciales son la práctica normal. Y no
  impide una respuesta tardía — cerrar declara que se dejó de esperar, no que se
  dejó de escuchar.
  """
  closeTransmittal(id: Int!, input: CloseTransmittalInput): Transmittal!

  # ─── Tipos de documento ───
  "Crear un tipo de documento"
  createDocumentType(input: CreateDocumentTypeInput!): DocumentType!

  "Actualizar un tipo de documento"
  updateDocumentType(id: Int!, input: UpdateDocumentTypeInput!): DocumentType!

  "Deshabilitar un tipo de documento"
  terminateDocumentType(id: Int!): DocumentType!

  "Reactivar un tipo de documento"
  activateDocumentType(id: Int!): DocumentType!

  "Eliminar permanentemente un tipo de documento"
  deleteDocumentType(id: Int!): Boolean!

  # ─── Clases de documento ───
  "Crear una clase de documento"
  createDocumentClass(input: CreateDocumentClassInput!): DocumentClass!

  "Actualizar una clase de documento"
  updateDocumentClass(
    id: Int!
    input: UpdateDocumentClassInput!
  ): DocumentClass!

  "Deshabilitar una clase de documento"
  terminateDocumentClass(id: Int!): DocumentClass!

  "Reactivar una clase de documento"
  activateDocumentClass(id: Int!): DocumentClass!

  "Eliminar permanentemente una clase de documento"
  deleteDocumentClass(id: Int!): Boolean!

  # ─── Áreas ───
  "Crear un área"
  createArea(input: CreateAreaInput!): Area!

  "Actualizar un área"
  updateArea(id: Int!, input: UpdateAreaInput!): Area!

  "Deshabilitar un área"
  terminateArea(id: Int!): Area!

  "Reactivar un área"
  activateArea(id: Int!): Area!

  "Eliminar permanentemente un área"
  deleteArea(id: Int!): Boolean!

  # ─── Adjuntos ───
  "Crear un nuevo adjunto"
  createAttachment(input: CreateAttachmentInput!): Attachment!

  "Eliminar un adjunto"
  deleteAttachment(id: Int!): Boolean!

  # ─── Archivos escaneados ───
  "Subir un archivo escaneado"
  createScannedFile(input: CreateScannedFileInput!): ScannedFile!

  "Editar metadata de un archivo escaneado (opcionalmente reemplazar archivo)"
  updateScannedFile(id: Int!, input: UpdateScannedFileInput!): ScannedFile!

  "Clasificar un archivo escaneado (ACCEPTED o DISCARDED)"
  classifyScannedFile(id: Int!, input: ClassifyScannedFileInput!): ScannedFile!

  "Marcar archivo como cargado en sistema externo"
  markAsUploaded(id: Int!, input: MarkAsUploadedInput!): ScannedFile!

  "Corregir la referencia externa de un archivo ya marcado como uploaded"
  updateExternalReference(id: Int!, externalReference: String!): ScannedFile!

  "Actualizar disposición física del papel"
  updatePhysicalDisposition(
    id: Int!
    disposition: PhysicalDispositionInput!
  ): ScannedFile!

  "Confirmar ejecución de la disposición física (DESTROY→DESTROYED, ARCHIVE→ARCHIVED)"
  confirmPhysicalDisposition(id: Int!): ScannedFile!

  "Dar de baja un archivo escaneado"
  terminateScannedFile(id: Int!): ScannedFile!

  "Reactivar un archivo escaneado"
  activateScannedFile(id: Int!): ScannedFile!

  "Revertir un archivo escaneado a estado pendiente (limpia clasificación y disposición)"
  resetScannedFileToPending(id: Int!): ScannedFile!

  "Eliminar permanentemente un archivo escaneado y su archivo del storage"
  deleteScannedFile(id: Int!): Boolean!

  # ─── Logs del Sistema ───
  "Archiva logs del sistema antiguos (mueve de DocumentSysLog a DocumentSysLogArchive)"
  archiveDocumentSysLogs(olderThanDays: Int!): Int!

  "Elimina logs archivados antiguos permanentemente"
  deleteDocumentSysLogsArchive(olderThanDays: Int!): Int!

  # ─── Federación A.5 — ProjectTask ↔ Document ───

  "Vincula un documento existente a una tarea de proyecto como entregable principal (capa 1). Requiere que Document.module = PROJECTS."
  linkDocumentToTask(documentId: Int!, projectTaskId: Int!): Document!

  "Quita el vínculo de entregable principal de un documento (no elimina el documento)"
  unlinkDocumentFromTask(documentId: Int!): Document!

  "Agrega una referencia documental a una tarea (input, output adicional o referencia, capa 2)"
  addTaskDocumentReference(
    input: TaskDocumentReferenceCreateInput!
  ): TaskDocumentReference!

  "Elimina una referencia documental de una tarea"
  removeTaskDocumentReference(id: Int!): Boolean!
}
