  "Nuevo módulo al que pertenece"
  module: ModuleTypeInput
  "Nueva clase de documento"
  classId: Int
  "Nueva descripción"
  description: String
  "Propone el circuito formal frente al mínimo. Es sugerencia y no invariante"
