"Clase de documento (nivel 1: Especialidad, Categoría)"
type DocumentClass @key(fields: "id") {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Fecha de última actualización"
  updatedAt: DateTime
  "Usuario que realizó la última actualización"
  updatedBy: UserName!
  "Fecha de deshabilitación"
  terminatedAt: DateTime
  "Indica si es un registro del sistema"
  isSys: Boolean!
  "Nombre de la clase de documento"
  name: String!
  "Código identificador de la clase"
  code: String!
  "Módulo al que pertenece (null = disponible para todos)"
  module: ModuleType
  "Alcance de la entrada. Null = catálogo del despliegue, del que los proyectos heredan"
  projectId: Int
  "Descripción de la clase de documento"
  description: String
  "Orden de visualización"
  sortOrder: Int!
  "Tipos de documento que pertenecen a esta clase"
  documentTypes: [DocumentType!]!
}

"Tipo de documento (Procedimiento, Plano, Informe, etc.)"
type DocumentType @key(fields: "id") {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Fecha de última actualización"
  updatedAt: DateTime
  "Usuario que realizó la última actualización"
  updatedBy: UserName!
  "Fecha de deshabilitación"
  terminatedAt: DateTime
  "Indica si es un registro del sistema"
  isSys: Boolean!
  "Nombre del tipo de documento"
  name: String!
  "Código identificador del tipo"
  code: String!
  "Módulo al que pertenece (null = disponible para todos)"
  module: ModuleType
  "Alcance de la entrada. Null = catálogo del despliegue, del que los proyectos heredan"
  projectId: Int
  "Clase de documento a la que pertenece (null = disponible para todas)"
  class: DocumentClass
  "Descripción del tipo de documento"
  description: String
  "Propone el circuito formal frente al mínimo. Es SUGERENCIA y no invariante: bajo D-03 toda revisión tiene circuito"
  requiresFormalReview: Boolean!
}

"Documento maestro"
type Document @key(fields: "id") {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Usuario que creó el documento"
  createdBy: UserName!
  "Fecha de última actualización"
  updatedAt: DateTime
  "Usuario que realizó la última actualización"
  updatedBy: UserName!
  "Fecha de deshabilitación"
  terminatedAt: DateTime
  "Indica si es un registro del sistema"
  isSys: Boolean!
  """
  Código único del documento. Es el IDENTIFICADOR y no cambia: está en los
  transmittals emitidos, en el payload de cada firma y en el rótulo de cada
  archivo que salió. Se corrige solo mientras no haya ninguna revisión aprobada.
  """
  code: String!
  """
  Título de la revisión EN CURSO. Es una COPIA: el dato vive en la revisión,
  porque está impreso en el rótulo. Para el título que dice el rótulo aprobado,
  leer `currentRevision.title`.
  """
  currentTitle: String!
  "Descripción del documento. Administrativa: no se imprime y se edita siempre"
  description: String
  "Módulo al que pertenece"
  module: ModuleType!
  "Proyecto al que pertenece. Nulo en el régimen de publicación, documentación que no circula"
  projectId: Int
  "Tipo de la revisión EN CURSO. Copia, como `currentTitle`"
  currentDocumentType: DocumentType!
  "Clase de la revisión EN CURSO. Copia, como `currentTitle`"
  currentDocumentClass: DocumentClass
  """
  Fecha en que quedó obsoleto, si lo está. Obsoleto NO es dado de baja:
  `terminatedAt` corrige un alta que no debió existir, y esto es un hecho del
  ciclo de vida —el documento existió, sirvió y dejó de servir— que conserva su
  historia entera. Un documento obsoleto no admite revisiones nuevas y su código
  sigue tomado dentro del ámbito.
  """
  obsoletedAt: DateTime
  "Quién lo declaró obsoleto"
  obsoletedBy: UserName
  "Motivo, obligatorio al declararlo"
  obsoleteReason: String
  """
  Por qué quedó obsoleto. Se DERIVA de si el documento figura como reemplazado
  en algún acto: no se guarda un indicador, que podría contradecir a los datos
  que lo originan. Nulo cuando el documento no está obsoleto.
  """
  obsolescenceCause: ObsolescenceCause
  "Actos de reemplazo en que participa, con su papel en cada uno"
  replacementItems: [DocReplacementItem!]!
  """
  Revisión VIGENTE: la última aprobada, y solo la aprobada. Nula mientras el
  documento no haya aprobado ninguna. No considera las revisiones abandonadas.
  """
  currentRevision: DocumentRevision
  """
  Revisión EN CURSO: la última no abandonada por secuencia de creación, en
  cualquier estado. Con A aprobada y B en circuito, currentRevision es A y
  lastRevision es B.
  """
  lastRevision: DocumentRevision
  "Historial de revisiones del documento, por secuencia de creación"
  revisions: [DocumentRevision!]!
  "Tarea de proyecto a la que pertenece este documento como entregable principal (capa 1 de la federación A.5)"
  projectTask: ProjectTask
  "Referencias documentales (inputs/outputs/refs) que apuntan a este documento desde tareas (capa 2)"
  taskDocumentReferences: [TaskDocumentReference!]!
}

# ═══════════════════════════════════════════════════════
# FEDERACIÓN A.5 — Vínculo ProjectTask ↔ Document
# ═══════════════════════════════════════════════════════

"Rol de un documento respecto a una tarea de proyecto"
enum TaskDocumentRole {
  "Insumo que la tarea consume (norma, BoD, especificación)"
  INPUT
  "Documento producido por la tarea (no es el entregable principal)"
  OUTPUT
  "Referencia cruzada (documento relacionado)"
  REFERENCE
}

"Variante de input de TaskDocumentRole (los enums no deben usarse como input y output simultáneamente)"
enum TaskDocumentRoleInput {
  "Insumo que la tarea consume (norma, BoD, especificación)"
  INPUT
  "Documento producido por la tarea (no es el entregable principal)"
  OUTPUT
  "Referencia cruzada (documento relacionado)"
  REFERENCE
}

type ProjectTask @key(fields: "id") {
  id: Int!
  "Documentos entregables de la tarea (capa 1: relación 1:N vía Document.projectTaskId)"
  documents: [Document!]!
  "Referencias documentales de la tarea: inputs, outputs adicionales y referencias (capa 2: N:N)"
  documentReferences: [TaskDocumentReference!]!
}

"Vínculo N:N entre una tarea de proyecto y un documento, con rol asociado (input/output/referencia)"
type TaskDocumentReference @key(fields: "id") {
  "Identificador único"
  id: Int!
  "Fecha de creación del vínculo"
  createdAt: DateTime!
  "Usuario que creó el vínculo"
  createdBy: UserName!
  "Tarea de proyecto vinculada"
  projectTask: ProjectTask!
  "Documento vinculado"
  document: Document!
  "Rol del documento respecto a la tarea"
  role: TaskDocumentRole!
}

"Revisión de un documento"
type DocumentRevision @key(fields: "id") {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Usuario que creó la revisión"
  createdBy: UserName!
  "Fecha de última actualización"
  updatedAt: DateTime
  "Documento al que pertenece la revisión"
  document: Document!
  "Código de la revisión (A, B, C...)"
  revisionCode: String!
  "Estado actual de la revisión"
  status: RevisionStatus!
  """
  Título de ESTA revisión, y por lo tanto lo que dice el rótulo de sus archivos.
  Vive acá y no en el documento porque está impreso dentro del archivo, y lo
  impreso pertenece a la emisión que lo produjo. Se copia de la revisión anterior
  al crearla, se edita mientras esté abierta y queda congelado al aprobarla.
  """
  title: String!
  "Tipo de documento de ESTA revisión"
  documentType: DocumentType!
  "Clase de documento de ESTA revisión"
  documentClass: DocumentClass
  "Versiones de esta revisión. Cada una es un conjunto de archivos"
  versions: [DocumentVersion!]!
  "Versión actual (la más reciente)"
  currentVersion: DocumentVersion
  """
  Qué le faltaría a esta revisión si se emitiera con el propósito indicado.

  Se consulta **mientras la revisión está abierta**, que es cuando incorporar el
  archivo no cuesta nada: la copia de trabajo está abierta y el conjunto todavía
  no se confirmó. Al emitir la advertencia se repite, ya sin remedio, porque la
  versión aprobada es inmutable.

  Toma el propósito por argumento porque la revisión todavía no sabe con cuál va
  a salir.
  """
  missingFileRoles(purpose: PurposeCodeInput!): [DocFileRole!]!
  """
  Circuitos de la revisión, por secuencia de creación. Una revisión admite
  VARIOS circuitos sucesivos: cada rechazo abre uno nuevo desde la elaboración,
  y cada cancelación uno desde el armado.
  """
  workflows: [ReviewWorkflow!]!
  """
  Circuito abierto, si lo hay. Se DERIVA de los circuitos: no se almacena, para
  que no pueda desincronizarse. Toda revisión viva tiene exactamente uno.
  """
  currentWorkflow: ReviewWorkflow
  "Armador designado al crear la revisión. Es el único actor que debe conocerse en el alta"
  assignedOrganizer: UserName!
  "Fecha de aprobación"
  approvedAt: DateTime
  "Usuario que aprobó la revisión"
  approvedBy: UserName
  "Fecha en que se abandonó la revisión"
  abandonedAt: DateTime
  "Usuario que abandonó la revisión"
  abandonedBy: UserName
  "Motivo del abandono"
  abandonReason: String
}

"Versión de archivo dentro de una revisión"
type DocumentVersion @key(fields: "id") {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Usuario que subió esta versión"
  createdBy: UserName!
  "Revisión a la que pertenece"
  revision: DocumentRevision!
  "Número de versión (1, 2, 3...)"
  versionNumber: Int!
  """
  Los archivos del conjunto. Un documento se entrega habitualmente como más de
  uno: el PDF que se revisa y se marca, con su editable en custodia y la
  evidencia que lo sustenta. Al menos uno con rol DELIVERABLE.
  """
  files: [DocVersionFile!]!
  "Comentario sobre los cambios. Opcional: la observación viaja dentro del archivo"
  comment: String
}

"Un archivo dentro del conjunto de la versión"
type DocVersionFile {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Versión a la que pertenece"
  version: DocumentVersion!
  "Papel del archivo dentro del conjunto"
  role: DocFileRole!
  "Key del archivo en DO Spaces"
  fileKey: String!
  "Nombre original del archivo"
  fileName: String!
  "Tamaño del archivo en bytes"
  fileSize: Int!
  "Tipo MIME del archivo"
  mimeType: String!
  "Hash SHA-256, OBLIGATORIO en cada archivo: es lo que la firma acredita"
  checksum: String!
}

"""
Papel del archivo dentro del conjunto de la versión.

Enumeración y no catálogo: el sistema interpreta el efecto —qué se revisa, qué
se marca, qué se exige al emitir—, de modo que un valor libre no tendría
comportamiento asociado.
"""
enum DocFileRole {
  "El entregable, típicamente PDF. Es lo que se revisa y se marca. Al menos uno"
  DELIVERABLE
  "La fuente editable, típicamente DWG. Acompaña en custodia. No se revisa"
  SOURCE
  "La evidencia que formó parte de producirlo: memoria de cálculo, ensayos, planillas"
  SUPPORT
}

"Causa por la que un documento quedó obsoleto. Derivada, no almacenada"
enum ObsolescenceCause {
  "Fue superado por otro en un acto de reemplazo"
  REPLACEMENT
  "Salió del alcance del proyecto, sin que nada lo reemplace"
  OUT_OF_SCOPE
}

"""
Copia de trabajo: el conjunto de archivos EN PREPARACIÓN.

Es lo que en la gestión documental se opera con check-out y check-in, con dos
diferencias: acá NO descarga —leer un archivo nunca fue un acto del ciclo— y NO
bloquea, porque la exclusividad ya la da el circuito, donde la versión la produce
quien tiene el paso vigente.

Mutable por naturaleza, y por eso no es una versión: la versión debe ser
inmutable una vez que existe, y lo que esta entidad resuelve es cuándo existe.
A lo sumo hay una abierta por revisión.
"""
type DocWorkingCopy {
  "Identificador único"
  id: Int!
  "Fecha en que se abrió"
  createdAt: DateTime!
  "Quién la abrió"
  createdBy: UserName!
  "Revisión en la que se prepara"
  revision: DocumentRevision!
  "Los archivos del conjunto en preparación"
  files: [DocWorkingCopyFile!]!
  "Fecha de confirmación, si se confirmó"
  confirmedAt: DateTime
  "Quién la confirmó"
  confirmedBy: UserName
  "La versión que produjo al confirmarse"
  version: DocumentVersion
  "Fecha de descarte, si se descartó"
  discardedAt: DateTime
  "Quién la descartó"
  discardedBy: UserName
  "Motivo del descarte, obligatorio"
  discardReason: String
}

"Un archivo dentro del conjunto en preparación"
type DocWorkingCopyFile {
  "Identificador único"
  id: Int!
  "Papel del archivo dentro del conjunto"
  role: DocFileRole!
  "Key del archivo en DO Spaces"
  fileKey: String!
  "Nombre original del archivo"
  fileName: String!
  "Tamaño del archivo en bytes"
  fileSize: Int!
  "Tipo MIME del archivo"
  mimeType: String!
  "Hash SHA-256"
  checksum: String!
}

"""
Acto de reemplazo entre documentos.

Reemplazar es SUPERAR: los reemplazados quedan obsoletos en el mismo acto. Es un
acto y no un par de referencias —agrupa los que salen y los que entran, con su
motivo—, porque sin esa agrupación una reorganización de dos documentos en dos
sería indistinguible de dos reemplazos separados.

La relación es N:M, y con ella quedan expresadas la recodificación (1:1), la
unificación (N:1) y la división (1:N). Qué clase de reemplazo es se DERIVA de la
cardinalidad y no se declara.

Los documentos de un acto comparten ámbito: lo que cruza de un proyecto al
régimen de publicación no es reemplazar sino promover, que es otra cosa.
"""
type DocReplacement {
  "Identificador único"
  id: Int!
  "Fecha del acto"
  createdAt: DateTime!
  "Quién lo registró"
  createdBy: UserName!
  "Motivo, obligatorio"
  reason: String!
  "Los documentos del acto, con su papel"
  items: [DocReplacementItem!]!
}

"Un documento dentro del acto, con su papel"
type DocReplacementItem {
  "Identificador único"
  id: Int!
  "El acto al que pertenece"
  replacement: DocReplacement!
  "El documento"
  document: Document!
  "Su papel en el acto"
  role: DocReplacementRole!
}

"Papel del documento dentro del acto de reemplazo"
enum DocReplacementRole {
  "Queda obsoleto en el mismo acto"
  REPLACED
  "Lo supera"
  REPLACING
}

