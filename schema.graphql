  Código de la primera revisión. Bajo ALPHA y NUMERIC el sistema lo calcula y
  rechaza uno distinto; bajo FREE_TEXT es obligatorio.
  """
  initialRevisionCode: String
  """
  Archivo inicial, OPCIONAL. El documento nace sin archivo porque el paso de
  elaboración existe para producirlo. Sigue siendo admisible para el proyecto
  que parte de un documento preexistente.
  """
  initialVersion: InitialVersionInput
}

"Archivo con que se da de alta un documento o una revisión preexistente"
input InitialVersionInput {
  "Key del archivo en DO Spaces"
  fileKey: String!
  "Nombre original del archivo"
  fileName: String!
  "Tamaño del archivo en bytes"
  fileSize: Int!
  "Tipo MIME del archivo"
  mimeType: String!
  "Hash SHA-256. Obligatorio en toda versión"
  checksum: String!
  "Comentario sobre el archivo"
  comment: String
}

"""
Input para actualizar lo ADMINISTRATIVO del documento.

El título, la clase y el tipo NO están acá: se editan sobre la revisión con
`updateRevisionMetadata`, porque están impresos en el rótulo y lo impreso
pertenece a la emisión que lo produjo. Lo que queda no aparece en ningún rótulo,
y por eso se edita siempre, incluso con la revisión vigente aprobada.
"""
input UpdateDocumentInput {
  "Ubicación física. Se edita siempre; nulo la retira"
  locationId: Int
  "Nueva descripción del documento"
  description: String
  "Tarea de proyecto de la que el documento es entregable"
  projectTaskId: Int
}

"Input para editar la identificación de una revisión"
input UpdateRevisionMetadataInput {
  "Nuevo título. Es lo que dirá el rótulo de los archivos de esta revisión"
  title: String
  "Nuevo tipo de documento"
  documentTypeId: Int
  "Nueva clase de documento. Nulo la deja sin clasificar"
  documentClassId: Int
}

"Input para registrar un acto de reemplazo entre documentos"
input ReplaceDocumentsInput {
  "Los que quedan obsoletos. Al menos uno"
  replacedIds: [Int!]!
  "Los que los superan. Al menos uno"
  replacingIds: [Int!]!
  "Motivo, obligatorio"
  reason: String!
}

"Un archivo del conjunto en preparación"
input WorkingCopyFileInput {
  "Papel del archivo dentro del conjunto"
  role: DocFileRoleInput!
  "Key del archivo en DO Spaces"
  fileKey: String!
  "Nombre original del archivo"
  fileName: String!
  "Tamaño del archivo en bytes"
  fileSize: Int!
  "Tipo MIME del archivo"
  mimeType: String!
  "Hash SHA-256. Obligatorio en cada archivo"
  checksum: String!
}

"Papel del archivo, para inputs"
enum DocFileRoleInput {
  "El entregable, típicamente PDF. Al menos uno por versión"
  DELIVERABLE
  "La fuente editable, típicamente DWG"
  SOURCE
  "La evidencia que formó parte de producirlo"
  SUPPORT
}

"""
Input para confirmar la copia de trabajo.

`files` es el ATAJO: informar el conjunto completo crea y cierra la copia en un
solo acto, sin acumulación previa. No son dos modelos sino la misma transición,
y es lo que necesita un cliente automático para no depender de una secuencia de
llamadas. Omitirlo confirma la copia que esté abierta.
"""
input ConfirmWorkingCopyInput {
  "Comentario sobre los cambios. Opcional: la observación viaja dentro del archivo"
  comment: String
  "Conjunto completo, para confirmar sin copia abierta"
  files: [WorkingCopyFileInput!]
}

"Input para crear una referencia documental tarea ↔ documento (Fase A.5, capa 2)"
input TaskDocumentReferenceCreateInput {
  "Tarea de proyecto que referencia el documento"
  projectTaskId: Int!
  "Documento referenciado"
  documentId: Int!
  "Rol del documento respecto a la tarea"
  role: TaskDocumentRoleInput!
}

"Input para crear una revisión"
input CreateRevisionInput {
  """
  Esquema con que se propone el código. NO se persiste. Si se omite, se infiere
  de la última revisión no abandonada; elegir otro reinicia la secuencia.
  """
  revisionScheme: RevisionSchemeInput
  """
  Código de la revisión. Bajo ALPHA y NUMERIC el sistema lo calcula y rechaza
  uno distinto; bajo FREE_TEXT es obligatorio.
  """
  revisionCode: String
  "Armador del circuito. Si se omite lo aporta el proyecto"
  assignedOrganizerId: Int
  "Archivo inicial, OPCIONAL: la revisión nace sin versiones"
  initialVersion: InitialVersionInput
}

"""
Input para completar el armado del circuito.

Designa al elaborador y al elenco, y materializa los pasos siguientes. El armado
y la elaboración los pone el sistema: no se declaran acá.
"""
input DefineWorkflowInput {
  """
  Elaborador. Obligatorio salvo en el rol Receptor, donde el documento llega ya
  elaborado desde afuera y el circuito no tiene paso de elaboración.
  """
  preparerId: Int
  "Revisores, aprobadores y acuses, en el orden en que se recorren"
  steps: [ReviewStepInput!]!
  "Motivo, obligatorio cuando quien arma no es el armador designado"
  delegationReason: String
}

"Input para un paso del circuito"
input ReviewStepInput {
  "Orden de ejecución del paso"
  stepOrder: Int!
  "Tipo de paso. Solo revisión, aprobación y toma de conocimiento"
  stepType: StepTypeInput!
  "ID del usuario asignado"
  assignedToId: Int!
}

"Input para un paso de una plantilla de circuito"
input WorkflowTemplateStepInput {
  "Orden de ejecución del paso"
  stepOrder: Int!
  "Tipo de paso. Solo revisión, aprobación y toma de conocimiento"
  stepType: StepTypeInput!
  """
  Actor preasignado, opcional. El elaborador NUNCA se preasigna: designarlo es
  distribuir carga de trabajo y se decide documento por documento.
  """
  assignedToId: Int
}

"Input para crear una plantilla de circuito"
input CreateDocWorkflowTemplateInput {
  "Nombre de la plantilla"
  name: String!
  "Descripción"
  description: String
  "Proyecto del alcance. Nulo alcanza a los documentos sin proyecto"
  projectId: Int
  "Clase del alcance. Nulo = todas las clases"
  documentClassId: Int
  "Tipo del alcance. Nulo = todos los tipos"
  documentTypeId: Int
  "Pasos que propone"
  steps: [WorkflowTemplateStepInput!]!
}

"Input para actualizar una plantilla de circuito"
input UpdateDocWorkflowTemplateInput {
  "Nuevo nombre"
  name: String
  "Nueva descripción"
  description: String
  """
  Pasos, que se REEMPLAZAN en bloque. Una plantilla es una propuesta completa, y
  editarla paso por paso invitaría a dejarla a medias. No altera circuitos en
  curso: los valores se copian al materializarse.
  """
  steps: [WorkflowTemplateStepInput!]
}

"Filtro del catálogo de ubicación física"
input DocLocationFilterInput {
  "Busca en el código, el nombre y la ruta completa"
  query: String
  "Descendencia directa de un nodo"
  parentId: Int
  "Solo los nodos raíz. Gana sobre parentId"
  rootsOnly: Boolean
  """
  La rama de un nodo: él y toda su descendencia.

  Gana sobre parentId y rootsOnly, porque los contiene: pedir la rama de un nodo
  es pedir ese nodo y todo lo que cuelga de él.
  """
  branchOf: Int
  "Estado de los registros a devolver"
  terminatedFilter: TerminatedFilterInput
}

"Input para crear un nodo de ubicación física"
input CreateLocationInput {
  "Alcance. Omitido = árbol del despliegue"
  projectId: Int
  "Nodo padre. Omitido = nodo raíz"
  parentId: Int
  "Código, único dentro de su nivel"
  code: String!
  "Nombre del nodo"
  name: String!
  "Orden de presentación entre hermanos"
  sortOrder: Int
  "Origen del objeto que describe. Exige externalRef"
  externalOrigin: DocLocationOriginInput
  "Identificador en el sistema de origen. Exige externalOrigin"
  externalRef: String
}

"""
Input para editar un nodo de ubicación física.

El padre no se edita acá: mover tiene operación propia, porque cambia de lugar
una rama entera y exige verificar que no se cuelgue de su propia descendencia.
"""
input UpdateLocationInput {
  "Código, único dentro de su nivel y alcance"
  code: String
  "Nombre del nodo. Cambiarlo recalcula la ruta de toda su descendencia"
  name: String
  "Orden de presentación entre hermanos"
  sortOrder: Int
  "Origen del objeto que describe. Nulo retira la referencia"
  externalOrigin: DocLocationOriginInput
  "Identificador en el sistema de origen. Nulo retira la referencia"
  externalRef: String
}

"Input para filtrar el catálogo de calificaciones"
input QualificationFilterInput {
  "Alcance. Omitido = catálogo del despliegue"
  projectId: Int
  "Estado de los registros a devolver"
  terminatedFilter: TerminatedFilterInput
}

"Input para crear una calificación"
input CreateQualificationInput {
  "Alcance. Omitido = catálogo del despliegue"
  projectId: Int
  "Código de la contraparte"
  code: String!
  "Rótulo que el usuario ve"
  label: String!
  "Efecto que el sistema interpreta"
  effect: QualificationEffectInput!
  "Orden dentro de la lista"
  sortOrder: Int
}

"""
Input para editar una calificación.

El alcance no se edita: moverla entre el despliegue y un proyecto cambiaría qué
valores tiene disponible cada proyecto sin que nadie lo declare.
"""
input UpdateQualificationInput {
  "Código de la contraparte"
  code: String
  "Rótulo que el usuario ve"
  label: String
  "Efecto que el sistema interpreta"
  effect: QualificationEffectInput
  "Orden dentro de la lista"
  sortOrder: Int
}

"Input para declarar la configuración documental del despliegue"
