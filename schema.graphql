  "Código único del documento"
  code: String!
  "Título del documento"
  title: String!
  "Descripción del documento"
  description: String
  "Módulo al que pertenece"
  module: ModuleTypeInput!
  "Proyecto al que pertenece. Obligatorio cuando el módulo es PROJECTS, prohibido en el resto"
  projectId: Int
  "ID del tipo de documento"
  documentTypeId: Int!
  "ID de la clase de documento"
  documentClassId: Int
  """
  Armador del primer circuito. Si se omite lo aporta el proyecto, de modo que en
  la práctica el campo llega lleno. Sin ninguno de los dos, el alta se rechaza.
  """
  assignedOrganizerId: Int
  """
  Esquema con que se propone el código de la primera revisión. NO se persiste:
  gobierna la propuesta y nada más. Si se omite, rige el del proyecto y, en su
  defecto, el del despliegue.
