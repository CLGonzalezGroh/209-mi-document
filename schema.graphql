# ═══════════════════════════════════════════════════════
# ENTIDADES PRINCIPALES
# ═══════════════════════════════════════════════════════

"Clase de documento (nivel 1: Especialidad, Categoría)"
type DocumentClass @key(fields: "id") {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Fecha de última actualización"
  updatedAt: DateTime
  "Usuario que realizó la última actualización"
  updatedBy: UserName!
  "Fecha de deshabilitación"
  terminatedAt: DateTime
  "Indica si es un registro del sistema"
  isSys: Boolean!
  "Nombre de la clase de documento"
  name: String!
  "Código identificador de la clase"
  code: String!
  "Módulo al que pertenece (null = disponible para todos)"
  module: ModuleType
  "Descripción de la clase de documento"
  description: String
  "Orden de visualización"
  sortOrder: Int!
  "Tipos de documento que pertenecen a esta clase"
  documentTypes: [DocumentType!]!
}

"Tipo de documento (Procedimiento, Plano, Informe, etc.)"
type DocumentType @key(fields: "id") {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Fecha de última actualización"
  updatedAt: DateTime
  "Usuario que realizó la última actualización"
  updatedBy: UserName!
  "Fecha de deshabilitación"
  terminatedAt: DateTime
  "Indica si es un registro del sistema"
  isSys: Boolean!
  "Nombre del tipo de documento"
  name: String!
  "Código identificador del tipo"
  code: String!
  "Módulo al que pertenece (null = disponible para todos)"
  module: ModuleType
  "Clase de documento a la que pertenece (null = disponible para todas)"
  class: DocumentClass
  "Descripción del tipo de documento"
  description: String
  "Propone el circuito formal frente al mínimo. Es SUGERENCIA y no invariante: bajo D-03 toda revisión tiene circuito"
  requiresFormalReview: Boolean!
}

"Documento maestro"
type Document @key(fields: "id") {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Usuario que creó el documento"
  createdBy: UserName!
  "Fecha de última actualización"
  updatedAt: DateTime
  "Usuario que realizó la última actualización"
  updatedBy: UserName!
  "Fecha de deshabilitación"
  terminatedAt: DateTime
  "Indica si es un registro del sistema"
  isSys: Boolean!
  "Código único del documento (ej: PR-001)"
  code: String!
  "Título del documento"
  title: String!
  "Descripción del documento"
  description: String
  "Módulo al que pertenece"
  module: ModuleType!
  "Proyecto al que pertenece. Nulo en el régimen de publicación, documentación que no circula"
  projectId: Int
  "Tipo de documento"
  documentType: DocumentType!
  "Clase de documento"
  documentClass: DocumentClass
  """
  Revisión VIGENTE: la última aprobada, y solo la aprobada. Nula mientras el
  documento no haya aprobado ninguna. No considera las revisiones abandonadas.
  """
  currentRevision: DocumentRevision
  """
  Revisión EN CURSO: la última no abandonada por secuencia de creación, en
  cualquier estado. Con A aprobada y B en circuito, currentRevision es A y
  lastRevision es B.
  """
  lastRevision: DocumentRevision
  "Historial de revisiones del documento, por secuencia de creación"
  revisions: [DocumentRevision!]!
  "Tarea de proyecto a la que pertenece este documento como entregable principal (capa 1 de la federación A.5)"
  projectTask: ProjectTask
  "Referencias documentales (inputs/outputs/refs) que apuntan a este documento desde tareas (capa 2)"
  taskDocumentReferences: [TaskDocumentReference!]!
}

# ═══════════════════════════════════════════════════════
# FEDERACIÓN A.5 — Vínculo ProjectTask ↔ Document
# ═══════════════════════════════════════════════════════

"Rol de un documento respecto a una tarea de proyecto"
enum TaskDocumentRole {
  "Insumo que la tarea consume (norma, BoD, especificación)"
  INPUT
  "Documento producido por la tarea (no es el entregable principal)"
  OUTPUT
  "Referencia cruzada (documento relacionado)"
  REFERENCE
}

"Variante de input de TaskDocumentRole (los enums no deben usarse como input y output simultáneamente)"
enum TaskDocumentRoleInput {
  "Insumo que la tarea consume (norma, BoD, especificación)"
  INPUT
  "Documento producido por la tarea (no es el entregable principal)"
  OUTPUT
  "Referencia cruzada (documento relacionado)"
  REFERENCE
}

type ProjectTask @key(fields: "id") {
  id: Int!
  "Documentos entregables de la tarea (capa 1: relación 1:N vía Document.projectTaskId)"
  documents: [Document!]!
  "Referencias documentales de la tarea: inputs, outputs adicionales y referencias (capa 2: N:N)"
  documentReferences: [TaskDocumentReference!]!
}

"Vínculo N:N entre una tarea de proyecto y un documento, con rol asociado (input/output/referencia)"
type TaskDocumentReference @key(fields: "id") {
  "Identificador único"
  id: Int!
  "Fecha de creación del vínculo"
  createdAt: DateTime!
  "Usuario que creó el vínculo"
  createdBy: UserName!
  "Tarea de proyecto vinculada"
  projectTask: ProjectTask!
  "Documento vinculado"
  document: Document!
  "Rol del documento respecto a la tarea"
  role: TaskDocumentRole!
}

"Revisión de un documento"
type DocumentRevision @key(fields: "id") {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Usuario que creó la revisión"
  createdBy: UserName!
  "Fecha de última actualización"
  updatedAt: DateTime
  "Documento al que pertenece la revisión"
  document: Document!
  "Código de la revisión (A, B, C...)"
  revisionCode: String!
  "Estado actual de la revisión"
  status: RevisionStatus!
  "Versiones de archivo de esta revisión"
  versions: [DocumentVersion!]!
  "Versión actual (la más reciente)"
  currentVersion: DocumentVersion
  """
  Circuitos de la revisión, por secuencia de creación. Una revisión admite
  VARIOS circuitos sucesivos: cada rechazo abre uno nuevo desde la elaboración,
  y cada cancelación uno desde el armado.
  """
  workflows: [ReviewWorkflow!]!
  """
  Circuito abierto, si lo hay. Se DERIVA de los circuitos: no se almacena, para
  que no pueda desincronizarse. Toda revisión viva tiene exactamente uno.
  """
  currentWorkflow: ReviewWorkflow
  "Armador designado al crear la revisión. Es el único actor que debe conocerse en el alta"
  assignedOrganizer: UserName!
  "Fecha de aprobación"
  approvedAt: DateTime
  "Usuario que aprobó la revisión"
  approvedBy: UserName
  "Fecha en que se abandonó la revisión"
  cancelledAt: DateTime
  "Usuario que abandonó la revisión"
  cancelledBy: UserName
  "Motivo del abandono"
  cancelReason: String
}

"Versión de archivo dentro de una revisión"
type DocumentVersion @key(fields: "id") {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Usuario que subió esta versión"
  createdBy: UserName!
  "Revisión a la que pertenece"
  revision: DocumentRevision!
  "Número de versión (1, 2, 3...)"
  versionNumber: Int!
  "Key del archivo en DO Spaces"
  fileKey: String!
  "Nombre original del archivo"
  fileName: String!
  "Tamaño del archivo en bytes"
  fileSize: Int!
  "Tipo MIME del archivo"
  mimeType: String!
  "Hash SHA-256, OBLIGATORIO: es lo que la firma acredita como contenido"
  checksum: String!
  "Comentario sobre los cambios. Opcional: la observación viaja dentro del archivo"
  comment: String
}

# ═══════════════════════════════════════════════════════
# WORKFLOW DE REVISIÓN (ISO 9001)
# ═══════════════════════════════════════════════════════

"Workflow de revisión de un documento"
type ReviewWorkflow @key(fields: "id") {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Revisión asociada al workflow"
  revision: DocumentRevision!
  "Estado actual del workflow"
  status: WorkflowStatus!
  "Pasos del workflow de revisión"
  steps: [ReviewStep!]!
  "Fecha en que se inició el workflow"
  initiatedAt: DateTime!
  "Usuario que inició el workflow"
  initiatedBy: UserName!
  "Fecha de finalización del workflow"
  completedAt: DateTime
  "Plantilla de la que salió la propuesta. Solo procedencia: los valores se copiaron al materializarse"
  template: DocWorkflowTemplate
  "Fecha de cancelación del circuito"
  cancelledAt: DateTime
  "Usuario que canceló el circuito"
  cancelledBy: UserName
  "Motivo de la cancelación"
  cancelReason: String
}

"Paso individual del workflow de revisión"
type ReviewStep {
  "Identificador único"
  id: Int!
  "Fecha de creación"
  createdAt: DateTime!
  "Workflow al que pertenece"
  workflow: ReviewWorkflow!
  "Orden de ejecución del paso"
  stepOrder: Int!
  "Tipo de paso (revisión, aprobación, toma de conocimiento)"
  stepType: StepType!
  "Usuario asignado al paso"
  assignedTo: UserName!
  "Estado actual del paso"
  status: StepStatus!
  "Comentarios del evaluador"
  comments: String
  "Fecha de resolución del paso"
  completedAt: DateTime
  """
  Quién resolvió efectivamente el paso. Nulo mientras está pendiente. La
  delegación se DERIVA de su divergencia con assignedTo.
  """
  resolvedBy: UserName
  "Motivo, obligatorio cuando quien resuelve no es el asignado"
  delegationReason: String
  """
  Firma del paso. Nula en el armado, que no firma: al completarse puede no
  existir todavía ninguna versión que acreditar.
  """
  signature: DocStepSignature
}

"""
Firma de un paso del circuito. Inmutable.

Persiste el payload canónico serializado junto con el hash y el algoritmo: un
hash sin sus insumos no es verificable. Verificar es recalcular el hash sobre el
payload guardado, y no sobre entidades que pudieron cambiar después.
"""
type DocStepSignature {
  "Identificador único"
  id: Int!
  "Momento en que se firmó"
  createdAt: DateTime!
  "Quién firmó. Coincide con el resolvedBy del paso"
  createdBy: UserName!
  "Algoritmo del hash"
  algorithm: String!
  """
  Payload canónico serializado. Contiene el paso, su circuito y su revisión; la
  versión vigente al firmar con su número, fileKey y checksum; la metadata del
  documento vigente al firmar; el usuario asignado y el que resolvió; y la
  acción con su momento.
  """
  payload: String!
  "Hash del payload"
